name: traffic-daily

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch traffic and merge JSONL
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.TRAFFIC_PAT }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = 'shimo4228';
            const repos = [
              'contemplative-agent',
              'agent-knowledge-cycle',
              'agent-attribution-practice',
              'authorship-strategy',
              'attention-not-self',
              'contemplative-agent-data',
              'zenn-content',
              'shimo4228',
            ];
            const dataDir = 'traffic/data';
            const fetchedAt = new Date().toISOString();
            const todayUTC = fetchedAt.slice(0, 10);
            // GitHub Traffic API back-fills clone/view counts for up to ~48h
            // after the day ends. Treat any date within this window as mutable
            // and overwrite with the latest API value; older dates are frozen.
            const STALE_WINDOW_DAYS = 14;
            const staleSince = new Date(Date.now() - STALE_WINDOW_DAYS * 86400000)
              .toISOString().slice(0, 10);

            const sameCounts = (a, b) =>
              a.clones.count === b.clones.count &&
              a.clones.uniques === b.clones.uniques &&
              a.views.count === b.views.count &&
              a.views.uniques === b.views.uniques;

            for (const repo of repos) {
              const filePath = path.join(dataDir, `${repo}.jsonl`);

              const existing = new Map();
              if (fs.existsSync(filePath)) {
                const content = fs.readFileSync(filePath, 'utf8');
                for (const line of content.split('\n')) {
                  if (!line.trim()) continue;
                  try {
                    const obj = JSON.parse(line);
                    existing.set(obj.date, obj);
                  } catch (e) {
                    core.warning(`Malformed line in ${filePath}: ${line.slice(0, 80)}`);
                  }
                }
              }

              let clones, views;
              try {
                const r = await github.request('GET /repos/{owner}/{repo}/traffic/clones', { owner, repo });
                clones = r.data.clones || [];
              } catch (e) {
                core.warning(`Skip ${repo} (clones): ${e.message}`);
                continue;
              }
              try {
                const r = await github.request('GET /repos/{owner}/{repo}/traffic/views', { owner, repo });
                views = r.data.views || [];
              } catch (e) {
                core.warning(`Skip ${repo} (views): ${e.message}`);
                continue;
              }

              const clonesByDate = {};
              for (const e of clones) {
                clonesByDate[e.timestamp.slice(0, 10)] = { count: e.count, uniques: e.uniques };
              }
              const viewsByDate = {};
              for (const e of views) {
                viewsByDate[e.timestamp.slice(0, 10)] = { count: e.count, uniques: e.uniques };
              }
              const allDates = new Set([...Object.keys(clonesByDate), ...Object.keys(viewsByDate)]);

              const merged = new Map(existing);
              let added = 0;
              let updated = 0;
              for (const date of allDates) {
                if (date === todayUTC) continue;
                const entry = {
                  date,
                  clones: clonesByDate[date] || { count: 0, uniques: 0 },
                  views: viewsByDate[date] || { count: 0, uniques: 0 },
                  fetched_at: fetchedAt,
                };
                const prev = merged.get(date);
                if (!prev) {
                  merged.set(date, entry);
                  added++;
                } else if (date >= staleSince && !sameCounts(prev, entry)) {
                  merged.set(date, entry);
                  updated++;
                }
              }

              if (added === 0 && updated === 0) {
                core.info(`${repo}: no changes`);
                continue;
              }
              const sortedDates = [...merged.keys()].sort();
              const output = sortedDates.map(d => JSON.stringify(merged.get(d))).join('\n') + '\n';
              fs.writeFileSync(filePath, output);
              core.info(`${repo}: added ${added}, updated ${updated}`);
            }

      - name: Regenerate graph.jsonld served-page mirror
        run: |
          # graph.jsonld is the source of truth; the served-page mirror in
          # traffic/dashboard/index.html must stay in sync so a hand-edit that
          # forgot to run the script cannot silently drift. Idempotent — writes
          # nothing on a normal day (only when graph.jsonld changed), so it does
          # not create spurious commits. Stdlib-only, no deps to install.
          python3 scripts/sync_graph_jsonld_mirror.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/data/ traffic/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No new traffic data or mirror change to commit"
          else
            git commit -m "chore(traffic): snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
