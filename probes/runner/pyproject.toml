[project]
name = "probes-runner"
version = "0.1.0"
description = "Two-channel LLM probe runner (parametric / retrieval) for the shimo4228 research ecosystem"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.70",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
