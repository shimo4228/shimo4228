defaults:
  temperature: 0
  max_tokens: 1024

# Per-provider param overrides applied on top of defaults; null removes the
# param. gpt-5.5 (reasoning tier) rejects explicit temperature — observed
# 2026-06-12: "'temperature' does not support 0 with this model".
param_overrides:
  # claude-sonnet-5 rejects explicit temperature — observed 2026-07-12 at
  # the v6 entry-event run: "`temperature` is deprecated for this model."
  # (same reasoning-tier pattern as gpt-5.5 below).
  anthropic:
    temperature: null
  openai:
    temperature: null
    # Reasoning tokens count against max_tokens; 1024 left zero visible text,
    # and at default effort even 8192 was fully consumed on one probe
    # (observed 2026-06-12). Low effort also matches the consumer default
    # (ChatGPT Instant) better than the API's default reasoning depth.
    # Tuned for gpt-5.5's reasoning tier; re-validate against gpt-5.6-luna
    # at the v9 entry-event run (Luna is documented as OpenAI's
    # fastest/cheapest 5.6-tier model, so its reasoning-token behavior may
    # differ) — left unchanged here, no run yet to observe against.
    max_tokens: 8192
    reasoning_effort: low
  gemini:
    # Same thinking-token squeeze: visible text truncated mid-sentence at
    # 1024 (observed 2026-06-12 on the author-identity probe).
    max_tokens: 8192
    # Temperature is NOT dropped here yet — deliberately. Observed
    # 2026-07-26 (every gemini call of that retrieval run, still on
    # gemini-3.5-flash): "`temperature`, `top_p`, and `top_k` continue to
    # function for Gemini 3+ but are planned for removal in a future
    # release. Move sampling guidance into the `system` instructions
    # instead." The param still works, so the panel keeps temperature: 0
    # for this provider. Re-check this notice against gemini-3.6-flash at
    # the v7 entry-event run; the contingency below still applies if it
    # starts rejecting the param outright.
    #
    # Contingency (recorded before the forcing event, as with the sampling
    # cadence): when gemini starts to REJECT explicit temperature — the
    # 400-class error already seen from gpt-5.5 and claude-sonnet-5 — cut
    # probes-v8.yaml with `gemini: temperature: null`, as a dated series
    # break. Do not act on the notice alone: an unforced sampling change
    # adds within-provider run-to-run variance without improving the
    # measured quantity, and two of five providers already run at their
    # provider default, so dropping it later stays series-consistent.
    #
    # The notice's own suggestion — moving sampling guidance into `system`
    # instructions — is rejected. The probes fix a bare user prompt as the
    # stimulus; adding a system message changes the stimulus itself and
    # breaks comparability across providers and across the whole series.
    #
    # Silent-expiry watch: if gemini ever IGNORES temperature instead of
    # rejecting it, the record's `temperature` field still reports what was
    # requested (see probe_runner.py), so records and actual sampling would
    # drift apart unnoticed. If the notice's wording changes from "planned
    # for removal" to "removed", cut v8 without waiting for a rejection.

# Pinned model ids (litellm format). Updating a model is a series break:
# note it here with a date comment and keep the old id commented out.
# Selection criterion: the widely-served default tier of each provider
# (what a typical user's LLM-mediated answer comes from), not the premium
# top tier. Operative test (sharpened 2026-07-12): the model served BY
# DEFAULT to a FREE-tier user in the provider's consumer chat product.
# A swap confined to paid tiers or agent surfaces is a PARTIAL swap →
# WATCH, not adoption; adopt when the free chat default moves. Worked
# examples (2026-07-12): sonnet-5 = free default since 07-01 → adopted;
# gpt-5.6-sol = paid tiers only → WATCH; grok-4.5 = coding flagship, not
# a consumer default → no action.
models:
  # 2026-07-12 (v6 series break): claude-sonnet-4-6 → claude-sonnet-5.
  # Catalog NEW MODEL event 2026-07-01; consumer default tier swapped to
  # sonnet-5 the same day (verified by human web check 2026-07-12).
  # anthropic: anthropic/claude-sonnet-4-6   # panel 2026-06-12 .. 2026-07-12
  anthropic: anthropic/claude-sonnet-5
  # 2026-09-22 (v9 series break): gpt-5.5 → gpt-5.6-luna.
  # OpenAI made gpt-5.6-luna the Free/Go ChatGPT default on 2026-08-06
  # (replacing gpt-5.5 Instant, unlimited free-tier text chat), confirmed
  # as the served consumer default by human web check 2026-09-01.
  # openai: openai/gpt-5.5   # panel 2026-06-12 .. 2026-09-22
  openai: openai/gpt-5.6-luna
  # 2026-08-01 (v7 series break): gemini-3.5-flash → gemini-3.6-flash.
  # Provider default model change 2026-07-21 (Google official announcement:
  # "Introducing Gemini 3.6 Flash, 3.5 Flash-Lite, and 3.5 Flash Cyber"),
