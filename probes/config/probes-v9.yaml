  #
  # 2026-09-20 (v8 series break): qwen3.7-plus → qwen3.8-flash. NOT a
  # default-tier change — forced by the free-quota expiry described in the
  # file header, and off-criterion by the author's 2026-09-20 decision.
  # qwen: qwen3.7-plus   # panel 2026-06-12 .. 2026-09-20
  qwen: qwen3.8-flash

