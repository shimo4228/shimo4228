# Unrelated to this break: the qwen column stays on the v8 forced
# substitution (qwen3.8-flash, off-criterion) — see the v8 note below,
# still current. The 2026-09-01 web check also re-confirmed anthropic
# (claude-sonnet-5) and gemini (gemini-3.6-flash) as unchanged MATCHes,
# and left xai (grok-4.3) and qwen as WATCH — see verified_current notes.
#
# v8 (2026-09-20): qwen panel model substitution — qwen3.7-plus →
# qwen3.8-flash (series break on the qwen column).
#
# READ THIS BEFORE COMPARING THE QWEN COLUMN ACROSS v7/v8. Unlike the v6
# and v7 breaks, this one is NOT a default-tier change. It is forced by the
# measurement's own billing surface, and the new pin is knowingly OFF the
# panel selection criterion:
#
#   Forcing event: DashScope grants free quota PER MODEL — 1M tokens, valid
#   90 days from activation / model release / approval, whichever is later
