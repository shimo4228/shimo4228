    - "10.5281/zenodo.19212118"  # Contemplative Agent (concept)
    - "10.5281/zenodo.19652013"  # AAP (concept)
    - "10.5281/zenodo.20262112"  # Attention, Not Self (concept)
    - "10.5281/zenodo.20263316"  # Authorship Strategy (concept)
    - "10.5281/zenodo.20337008"  # doctrine-corpus
    - "10.5281/zenodo.20353789"  # paper
    - "10.5281/zenodo.20355907"  # paper
    - "10.5281/zenodo.20558800"  # existence-proof
    - "10.5281/zenodo.20578272"  # paper
  owned_url_patterns:
    - "github\\.com/shimo4228"
    - "huggingface\\.co/datasets/[Ss]himo4228"
    - "shimo4228\\.github\\.io"
    - "orcid\\.org/0009-0002-6168-4162"
    - "wikidata\\.org/wiki/Q140090100"
    # v3: authored writing surfaces — citing the author's articles is citing
    # owned content (a GPT-5.5 retrieval answer cited the Zenn article and
    # the v2 lexicon missed it, observed 2026-06-12)
    - "zenn\\.dev/shimo4228"
    - "dev\\.to/shimo4228"
    - "substack\\.com/@?shimo4228"
    - "shimo4228\\.substack\\.com"
  project_terms:
    akc:
      - "Agent Knowledge Cycle"
      - "agent-knowledge-cycle"
      - "AKC"
    contemplative:
