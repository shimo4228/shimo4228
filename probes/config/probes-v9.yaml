  # coined term). v3 (2026-06-12) added the writing-surface URL patterns.
  # v2 (2026-06-12): echo guard — terms present in the prompt do not count
  # as named ("I don't know Tatsuya Shimomoto" echoes, it does not
  # attribute). Stored earlier verdicts are re-scorable from retained raw
  # text.
  detector_version: v4
  author_aliases:
    - "shimo4228"
    - "Tatsuya Shimomoto"
    - "Shimomoto, Tatsuya"
    - "下本竜也"
    - "0009-0002-6168-4162"   # ORCID
  # Owned identifiers: a citation counts as "ours" only if it matches one of
  # these. A generic Zenodo DOI that is not in this list is NOT ours.
  owned_dois:
