#   154,091 across both channels). Every call since has returned 403
#   AllocationQuota.FreeTierOnly, so the qwen column is empty for the
#   2026-09-13 and 2026-09-20 retrieval runs.
#   Author decision 2026-09-20: stay on free quota rather than enable
#   pay-as-you-go, and move the pin to a qwen3.8 model with an open window.
#
#   Criterion status: FAILS the operative test below. A human web check of
