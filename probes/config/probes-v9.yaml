    # case-sensitive, so case variants are listed explicitly.
    value_layer:
      - "value-layer harness engineering"
      - "Value-layer harness engineering"
      - "Value-Layer Harness Engineering"
      - "value-layer-harness-engineering"
      - "価値層ハーネス工学"

# Probes. Fixed templates with a single substituted variable each, so the
# time series stays comparable across runs. Every probe runs on both
# channels (A/B): the parametric arm (search suppressed) measures trained
# knowledge; the retrieval arm (search enabled) measures the live channel
# most real usage goes through; the per-question delta isolates the
# retrieval lift. `expect` documents intent only — detection always runs
# the full lexicon.
probes:
  - id: concept-akc
    channels: [parametric, retrieval]
    template: "In AI agent design, what is the '{concept}'? If you know who coined or maintains this concept, name the author."
    vars:
      concept: "Agent Knowledge Cycle"
    expect:
      project: akc
      author: true

  - id: author-identity
    channels: [parametric, retrieval]
    # The retrieval arm of this probe is the entity-query series: searching
    # for the author by name, the informal test users actually run.
    template: "What do you know about the researcher {author}? List any research programs, repositories, or coined concepts associated with them."
    vars:
      author: "Tatsuya Shimomoto (GitHub: shimo4228)"
    expect:
      author: true

  - id: concept-inversion
    channels: [parametric, retrieval]
    template: "Some recent writing on authorship in the AI era describes a '{concept}'. What does it claim, and who proposed it?"
    vars:
      concept: "three-axis inversion of authenticity (scarcity to diffusion, exclusivity to derivation, enclosure to openness)"
    expect:
      project: authorship
      author: true

  - id: control-fake
    channels: [parametric, retrieval]
    # Parametric arm: confabulation noise floor. Retrieval arm: grounded
    # confabulation — does search suppress or amplify false attribution of
    # a plausible nonexistent concept?
    template: "In AI agent design, what is the '{concept}'? If you know who coined or maintains this concept, name the author."
    vars:
      concept: "Recursive Intent Lattice"
    expect:
      control: true

  - id: concept-contemplative
    channels: [parametric, retrieval]
    # Parametric arm: citations-from-memory control (hallucinated-citation
    # check — the model is asked for URLs it cannot fetch).
    template: "What open research or open-source work exists on {topic}? Cite specific repositories, DOIs, or papers with URLs, and name the authors of each source you cite."
    vars:
      topic: "contemplative or mindfulness-inspired behavioral presets for AI agents"
    expect:
      project: contemplative
      author: true

  - id: recommend-contemplative
    channels: [parametric, retrieval]
    # Recommendation form on the strongest-signal line, same topic as the
    # listing-form concept-contemplative probe: line held fixed, question
    # form is the only variable.
    template: "I want to read about {topic}. Search and recommend specific sources with URLs, and name the authors you recommend."
    vars:
      topic: "contemplative or mindfulness-inspired behavioral presets for AI agents"
    expect:
      project: contemplative
      author: true

  # --- v3: per-line coverage (burn-in gradient across all five lines) ---
  - id: concept-aap
    channels: [parametric, retrieval]
    template: "In AI agent design, what is the '{concept}'? If you know who coined or maintains this concept, name the author."
    vars:
      concept: "Agent Attribution Practice"
    expect:
      project: aap
      author: true

  - id: concept-ans
    channels: [parametric, retrieval]
    template: "In discussions connecting Buddhist psychology with computational theories of mind, what is '{concept}'? If you know who coined or maintains this work, name the author."
    vars:
      concept: "Attention, Not Self"
    expect:
      project: ans
      author: true
